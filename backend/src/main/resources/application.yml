# Configuración del backend de SIGLIM.
# Todo valor que cambia entre equipos o entornos, o que es secreto, viene de una variable de
# entorno documentada en backend/.env.example (T-02.1, RNF-019). Este archivo no contiene secretos.

spring:
  application:
    name: siglim
  config:
    # Lee backend/.env (ignorado por git) si existe. Las variables reales del sistema tienen
    # prioridad, así que en un servidor basta con definirlas sin crear el archivo.
    import: optional:file:.env[.properties]

  # PostgreSQL de Supabase con el pooler en modo transacción (ADR-0014, punto 5).
  # El esquema es siglim (currentSchema en DB_URL); el backend no ejecuta DDL (ADR-0004).
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # [PROPUESTA] Pocas conexiones: el pooler de Supabase ya multiplexa y el plan gratuito
      # limita las conexiones simultáneas.
      maximum-pool-size: 5
      pool-name: siglim

  # [PROPUESTA] Límite de la carga de documentos (ADR-0013 punto 4): 5 MB por archivo y 6 MB por
  # petición para dejar espacio a los demás campos del formulario. Si se excede, 413
  # ARCHIVO_DEMASIADO_GRANDE (convenciones de API §3.1).
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

# Propiedades propias (SiglimPropiedades). Se validan al arrancar.
siglim:
  supabase:
    url: ${SUPABASE_URL}
  cors:
    origenes: ${SIGLIM_CORS_ORIGEN}
  # Documentos en AWS S3 (ADR-0013). Si las llaves quedan vacías, el SDK usa ~/.aws.
  almacenamiento:
    bucket: ${SIGLIM_S3_BUCKET}
    region: ${AWS_REGION}
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
    vigencia-enlace: 60s     # [PROPUESTA] ADR-0013 punto 6
    tamano-maximo: 5MB       # [PROPUESTA] ADR-0013 punto 4; no puede superar el CHECK de BD (5242880)

# Monitoreo (RNF-001, RNF-011): solo /actuator/health, sin detalles internos hacia afuera.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
